name: cosmo_gpu

on:
  push:
    paths: ["cosmo_gpu/**", "interactions/**", ".github/workflows/cosmo_gpu.yml"]
  pull_request:
    paths: ["cosmo_gpu/**", "interactions/**", ".github/workflows/cosmo_gpu.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: cosmo_gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
