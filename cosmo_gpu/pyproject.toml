[build-system]
requires = ["uv_build>=0.11.20,<0.12"]
build-backend = "uv_build"

[project]
name = "cosmo-gpu"
version = "0.0.1"
description = "M-scheme shell-model CI with a factorized on-the-fly matvec for CPU (Numba) and GPU (CuPy)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=1.26", "numba>=0.59", "scipy>=1.11"]

[project.optional-dependencies]
gpu = ["cupy>=13"]
mpi = ["mpi4py>=3.1"]
io = ["h5py>=3.9"]

[dependency-groups]
# installed by `uv sync` by default
dev = ["pytest>=8", "ruff==0.11.10", "mypy==1.15.0"]

[project.scripts]
cosmo-gpu = "cosmo_gpu.cli:main"

[tool.uv.build-backend]
module-name = "cosmo_gpu"
module-root = "src"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running physics checks (run inside a Slurm job)"]
addopts = "-ra -m \"not slow\""
filterwarnings = ["ignore:.*TBB.*:numba.core.errors.NumbaWarning"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "C4",            # comprehensions
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "NPY",           # numpy-specific
  "PT",            # pytest style
  "PERF",          # performance anti-patterns
  "PL",            # pylint subset
  "D",             # docstrings (numpy convention)
  "ANN",           # annotations on public functions
]
ignore = [
  "N803", "N806",  # physics names (J, M, V, Hpp, D) as arguments and locals
  "PLR0913",       # kernel ABI functions take many arguments
  "PLR2004",       # physics constants inline
  "E741",          # l is orbital angular momentum
  "D105", "D107",  # magic methods and __init__ need no docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004"]
"src/cosmo_gpu/*_kernels.py" = ["PERF", "PLR0912", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/cosmo_gpu", "tests"]
exclude = ["tests/data/"]

[[tool.mypy.overrides]]
module = ["numba.*", "cupy.*", "mpi4py.*", "scipy.*", "h5py.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Numba kernel modules (*_kernels.py): @njit is untyped; typed wrappers carry the public API
module = ["cosmo_gpu.bits_kernels", "cosmo_gpu.reference_kernels"]
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
check_untyped_defs = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
